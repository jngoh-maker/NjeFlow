global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon
    ssl-default-bind-options ssl-min-ver TLSv1.2 # SSL

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend njeflow_http
    bind *:80
    # Let's Encrypt challenges go to certbot (runs on 127.0.0.1:8888 only while renewing)
    acl is_acme path_beg /.well-known/acme-challenge/
    use_backend certbot_back if is_acme
    http-request redirect scheme https code 301 unless is_acme # SSL
    default_backend njeflow_back

frontend njeflow_https # SSL
    bind *:443 ssl crt /etc/haproxy/certs/DOMAIN.pem # SSL
    http-request set-header X-Forwarded-Proto https # SSL
    default_backend njeflow_back # SSL

backend njeflow_back
    balance roundrobin
    # Health check: a server that stops answering /health is taken out of rotation
    option httpchk GET /health
    http-check expect status 200
    server web01 WEB01_IP:80 check inter 5s fall 3 rise 2
    server web02 WEB02_IP:80 check inter 5s fall 3 rise 2

backend certbot_back
    server certbot 127.0.0.1:8888
